name: Stage reviewed resumption helpers
description: Preserve reviewed recovery helpers before checking out a retained source revision.

inputs:
  include-homebrew-validator:
    description: Also stage the reviewed Homebrew package validator.
    required: false
    default: "false"
  include-release-publisher:
    description: Also stage the reviewed release publisher and its runtime helpers.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Stage source restoration helper
      shell: bash
      run: |
        set -euo pipefail
        helper="${RUNNER_TEMP}/calrelay-restore-retained-source.sh"
        rm -f "$helper"
        git show "${GITHUB_SHA}:scripts/release/restore-retained-source.sh" > "$helper"
        [[ -s "$helper" ]] || { echo 'Reviewed source restoration helper is empty.' >&2; exit 1; }
    - name: Stage Homebrew validator
      if: inputs.include-homebrew-validator == 'true'
      shell: bash
      run: |
        set -euo pipefail
        validator="${RUNNER_TEMP}/calrelay-validate-homebrew-packages.mjs"
        rm -f "$validator"
        git show "${GITHUB_SHA}:scripts/release/validate-homebrew-packages.mjs" > "$validator"
        [[ -s "$validator" ]] || { echo 'Reviewed Homebrew validator is empty.' >&2; exit 1; }
    - name: Stage release publisher
      if: inputs.include-release-publisher == 'true'
      shell: bash
      run: |
        set -euo pipefail
        directory="${RUNNER_TEMP}/calrelay-release-publisher"
        rm -rf "$directory"
        mkdir -p "$directory"
        git show "${GITHUB_SHA}:scripts/release/publish-release.mjs" > "$directory/publish-release.mjs"
        git show "${GITHUB_SHA}:scripts/release/release-state.mjs" > "$directory/release-state.mjs"
        git show "${GITHUB_SHA}:scripts/release/generate-homebrew-packages.mjs" > "$directory/generate-homebrew-packages.mjs"
        [[ -s "$directory/publish-release.mjs" ]] || { echo 'Reviewed release publisher is empty.' >&2; exit 1; }
        [[ -s "$directory/release-state.mjs" ]] || { echo 'Reviewed release state helper is empty.' >&2; exit 1; }
        [[ -s "$directory/generate-homebrew-packages.mjs" ]] || { echo 'Reviewed Homebrew package generator is empty.' >&2; exit 1; }