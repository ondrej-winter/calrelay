name: CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      bootstrap:
        description: Bootstrap the first public release at v1.0.0
        required: false
        type: boolean
        default: false
      resume_run_id:
        description: Workflow run ID containing the immutable release-candidate artifact to resume
        required: false
        type: string

permissions:
  actions: read
  contents: read

jobs:
  portable-ci:
    runs-on: ubuntu-26.04
    outputs:
      release: ${{ steps.selection.outputs.release }}
      source_revision: ${{ steps.context.outputs.source_revision }}
      validation_revision: ${{ steps.context.outputs.validation_revision }}
      release_commit: ${{ steps.resume-context.outputs.release_commit }}
      release_tag: ${{ steps.resume-context.outputs.tag }}
      previous_version: ${{ steps.selection.outputs.previous_version }}
      resume: ${{ steps.selection.outputs.resume }}
    steps:
      - name: Check out captured source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pinned Node
        uses: ./.github/actions/setup-release-node
      - name: Validate release JavaScript syntax
        run: |
          set -euo pipefail
          find scripts/release -type f -name '*.mjs' -print0 | sort -z | xargs -0 -n 1 node --check
      - name: Select release or resumption
        id: selection
        env:
          BOOTSTRAP: ${{ inputs.bootstrap }}
          EVENT_NAME: ${{ github.event_name }}
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
        run: |
          set -euo pipefail
          printf 'source_revision=%s\n' "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          previous="$(git tag --list 'v*' --sort=-version:refname | head -n 1)"
          printf 'previous_version=%s\n' "${previous#v}" >> "$GITHUB_OUTPUT"
          if [[ "$EVENT_NAME" == workflow_dispatch && "$GITHUB_REF" != refs/heads/master ]]; then
            echo 'Manual release dispatches must target master.' >&2
            exit 1
          fi
          if [[ "$EVENT_NAME" == pull_request || "$GITHUB_REF" != refs/heads/master ]]; then
            printf 'release=false\nresume=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -n "${RESUME_RUN_ID:-}" ]]; then
            [[ "$RESUME_RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo 'resume_run_id must be a positive workflow run ID.' >&2; exit 1; }
            [[ "${BOOTSTRAP:-false}" != true ]] || { echo 'bootstrap and resume_run_id are mutually exclusive.' >&2; exit 1; }
            printf 'release=true\nresume=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          arguments=(select)
          [[ "${BOOTSTRAP:-false}" == true ]] && arguments+=(--bootstrap)
          selection="$(node scripts/release/release-policy.mjs "${arguments[@]}")"
          release="$(node -e 'const value=JSON.parse(process.argv[1]); process.stdout.write(value.nextVersion ? "true" : "false")' "$selection")"
          printf 'release=%s\nresume=false\n' "$release" >> "$GITHUB_OUTPUT"
      - name: Download retained candidate for provenance validation
        if: steps.selection.outputs.resume == 'true'
        uses: ./.github/actions/download-release-candidate
        with:
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ github.token }}
      - name: Verify retained candidate provenance
        if: steps.selection.outputs.resume == 'true'
        id: resume-context
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
        run: |
          set -euo pipefail
          metadata="${RUNNER_TEMP}/calrelay-resume-run.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RESUME_RUN_ID}" > "$metadata"
          node scripts/release/verify-resume-workflow.mjs \
            --state "${RUNNER_TEMP}/calrelay-release-candidate/release-state.json" \
            --run "$metadata" \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$RESUME_RUN_ID" \
            --output "$GITHUB_OUTPUT"
      - name: Select exact source and validation revisions
        id: context
        env:
          CURRENT_SOURCE_REVISION: ${{ steps.selection.outputs.source_revision }}
          RESUME: ${{ steps.selection.outputs.resume }}
          RETAINED_SOURCE_REVISION: ${{ steps.resume-context.outputs.source_revision }}
          RETAINED_VALIDATION_REVISION: ${{ steps.resume-context.outputs.validation_revision }}
        run: |
          set -euo pipefail
          source_revision="$CURRENT_SOURCE_REVISION"
          validation_revision="$CURRENT_SOURCE_REVISION"
          if [[ "$RESUME" == true ]]; then
            source_revision="$RETAINED_SOURCE_REVISION"
            validation_revision="$RETAINED_VALIDATION_REVISION"
          fi
          [[ "$source_revision" =~ ^[0-9a-f]{40}$ ]] \
            || { echo 'Source revision must be a full lowercase Git revision.' >&2; exit 1; }
          [[ "$validation_revision" =~ ^[0-9a-f]{40}$ ]] \
            || { echo 'Validation revision must be a full lowercase Git revision.' >&2; exit 1; }
          printf 'source_revision=%s\n' "$source_revision" >> "$GITHUB_OUTPUT"
          printf 'validation_revision=%s\n' "$validation_revision" >> "$GITHUB_OUTPUT"
      - name: Clean portable release context
        if: always()
        run: rm -rf "${RUNNER_TEMP}/calrelay-release-candidate" "${RUNNER_TEMP}/calrelay-resume-run.json"

  apple-ci:
    needs: portable-ci
    runs-on: xcode-27
    outputs:
      validated_revision: ${{ steps.validation.outputs.validated_revision }}
    steps:
      - name: Check out current workflow automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pinned Node
        uses: ./.github/actions/setup-release-node
      - name: Stage reviewed resumption helpers
        if: needs.portable-ci.outputs.resume == 'true'
        uses: ./.github/actions/stage-resumption-helpers
      - name: Download retained candidate for validation
        if: needs.portable-ci.outputs.resume == 'true'
        uses: ./.github/actions/download-release-candidate
        with:
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ github.token }}
      - name: Check out validation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.portable-ci.outputs.source_revision }}
          path: validation-source
      - name: Restore retained validation revision
        if: needs.portable-ci.outputs.resume == 'true'
        working-directory: validation-source
        env:
          RELEASE_COMMIT: ${{ needs.portable-ci.outputs.release_commit }}
          RELEASE_TAG: ${{ needs.portable-ci.outputs.release_tag }}
        run: |
          zsh "${RUNNER_TEMP}/calrelay-restore-retained-source.sh" \
            "${RUNNER_TEMP}/calrelay-release-candidate" "$RELEASE_COMMIT" "$RELEASE_TAG"
      - name: Set up pinned SwiftLint
        uses: ./.github/actions/setup-swiftlint
        with:
          source-directory: ${{ github.workspace }}/validation-source
      - name: Validate release shell syntax
        working-directory: validation-source
        run: zsh -n scripts/release/*.sh
      - name: Run source quality gates
        working-directory: validation-source
        run: |
          make format-check
          make check
      - name: Record validated revision
        id: validation
        working-directory: validation-source
        run: printf 'validated_revision=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Clean Apple validation material
        if: always()
        run: |
          rm -rf "${RUNNER_TEMP}/calrelay-release-candidate" "${RUNNER_TEMP}/calrelay-swiftlint" \
            "${RUNNER_TEMP}/portable_swiftlint.zip"
          rm -f "${RUNNER_TEMP}/calrelay-restore-retained-source.sh"

  protected-release:
    needs: [portable-ci, apple-ci]
    if: >-
      needs.portable-ci.outputs.release == 'true'
      && needs.apple-ci.outputs.validated_revision == needs.portable-ci.outputs.validation_revision
    runs-on: xcode-27
    environment: public-beta-release
    concurrency:
      group: calrelay-public-beta-release
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out current workflow automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pinned Node
        uses: ./.github/actions/setup-release-node
      - name: Download retained candidate for resumption
        if: needs.portable-ci.outputs.resume == 'true'
        uses: ./.github/actions/download-release-candidate
        with:
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ github.token }}
      - name: Stage reviewed resumption helpers
        if: needs.portable-ci.outputs.resume == 'true'
        uses: ./.github/actions/stage-resumption-helpers
        with:
          include-homebrew-validator: true
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.portable-ci.outputs.source_revision }}
      - name: Move retained candidate into release workspace
        if: needs.portable-ci.outputs.resume == 'true'
        run: |
          mkdir -p .build
          mv "${RUNNER_TEMP}/calrelay-release-candidate" .build/release-candidate
      - name: Restore retained release commit from source bundle
        if: needs.portable-ci.outputs.resume == 'true'
        env:
          RELEASE_COMMIT: ${{ needs.portable-ci.outputs.release_commit }}
          RELEASE_TAG: ${{ needs.portable-ci.outputs.release_tag }}
        run: |
          zsh "${RUNNER_TEMP}/calrelay-restore-retained-source.sh" \
            .build/release-candidate "$RELEASE_COMMIT" "$RELEASE_TAG"
      - name: Validate protected release configuration
        env:
          TAP_REPOSITORY: ${{ vars.CALRELAY_TAP_REPOSITORY }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == ondrej-winter/calrelay ]] || { echo 'Release workflow is restricted to ondrej-winter/calrelay.' >&2; exit 1; }
          [[ "$TAP_REPOSITORY" == ondrej-winter/homebrew-tap ]] || { echo 'CALRELAY_TAP_REPOSITORY must be ondrej-winter/homebrew-tap.' >&2; exit 1; }
          command -v gh >/dev/null
          command -v brew >/dev/null
      - name: Prepare release notes
        if: needs.portable-ci.outputs.resume != 'true'
        env:
          BOOTSTRAP: ${{ inputs.bootstrap }}
        run: |
          set -euo pipefail
          mkdir -p .build/release-metadata
          arguments=(notes)
          [[ "${BOOTSTRAP:-false}" == true ]] && arguments+=(--bootstrap)
          node scripts/release/release-policy.mjs "${arguments[@]}" > .build/release-metadata/release-notes.md
      - name: Create isolated source publication remote
        if: needs.portable-ci.outputs.resume != 'true'
        env:
          SOURCE_REVISION: ${{ needs.portable-ci.outputs.source_revision }}
        run: |
          set -euo pipefail
          git switch -C master "$SOURCE_REVISION"
          rm -rf "${RUNNER_TEMP}/calrelay-source-publication.git"
          git clone --bare . "${RUNNER_TEMP}/calrelay-source-publication.git"
      - name: Prepare release commit and tag with semantic-release
        if: needs.portable-ci.outputs.resume != 'true'
        env:
          CALRELAY_RELEASE_SOURCE_REVISION: ${{ needs.portable-ci.outputs.source_revision }}
          CALRELAY_RELEASE_SOURCE_REMOTE: https://github.com/${{ github.repository }}.git
        run: |
          set -euo pipefail
          arguments=(--repository-url "file://${RUNNER_TEMP}/calrelay-source-publication.git")
          [[ "${{ inputs.bootstrap }}" == true ]] && arguments+=(--bootstrap)
          scripts/release/run-semantic-release.sh "${arguments[@]}"
      - name: Build signed and notarized candidate
        if: needs.portable-ci.outputs.resume != 'true'
        env:
          CALRELAY_DEVELOPER_ID_P12: ${{ secrets.CALRELAY_DEVELOPER_ID_P12 }}
          CALRELAY_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.CALRELAY_DEVELOPER_ID_P12_PASSWORD }}
          CALRELAY_NOTARY_API_KEY_P8: ${{ secrets.CALRELAY_NOTARY_API_KEY_P8 }}
          CALRELAY_NOTARY_KEY_ID: ${{ secrets.CALRELAY_NOTARY_KEY_ID }}
          CALRELAY_NOTARY_ISSUER_ID: ${{ secrets.CALRELAY_NOTARY_ISSUER_ID }}
          CALRELAY_DEVELOPER_TEAM_ID: ${{ vars.CALRELAY_DEVELOPER_TEAM_ID }}
          CALRELAY_SIGNING_CERTIFICATE_SHA1: ${{ secrets.CALRELAY_SIGNING_CERTIFICATE_SHA1 }}
        run: make release-artifacts
      - name: Stage immutable release candidate
        if: needs.portable-ci.outputs.resume != 'true'
        env:
          PREVIOUS_VERSION: ${{ needs.portable-ci.outputs.previous_version }}
          SOURCE_REVISION: ${{ needs.portable-ci.outputs.source_revision }}
        run: |
          set -euo pipefail
          node scripts/release/stage-release-candidate.mjs \
            --candidate-directory .build/release-candidate \
            --artifacts-directory .build/release-artifacts \
            --manifest .build/release-artifacts/candidate-manifest.json \
            --version "$(cat VERSION)" \
            --previous-version "${PREVIOUS_VERSION:-0.0.0}" \
            --source-revision "$SOURCE_REVISION" \
            --notes-file .build/release-metadata/release-notes.md
      - name: Retain immutable candidate for resumption
        if: needs.portable-ci.outputs.resume != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-candidate
          path: .build/release-candidate
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
      - name: Create least-privilege publication token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.CALRELAY_RELEASE_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.CALRELAY_RELEASE_GITHUB_APP_PRIVATE_KEY }}
          owner: ondrej-winter
          repositories: calrelay,homebrew-tap
          permission-contents: write
      - name: Publish and verify immutable release assets
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CALRELAY_GIT_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          node scripts/release/publish-release.mjs assets \
            --candidate-directory .build/release-candidate \
            --source-repository "$GITHUB_REPOSITORY" \
            --tap-repository "${{ vars.CALRELAY_TAP_REPOSITORY }}" \
            --source-remote "https://github.com/${GITHUB_REPOSITORY}.git" \
            --tap-remote "https://github.com/${{ vars.CALRELAY_TAP_REPOSITORY }}.git" \
            --work-directory .build/release-publication \
            --gh "$(command -v gh)"
      - name: Check out previous tap packages
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ vars.CALRELAY_TAP_REPOSITORY }}
          token: ${{ steps.app-token.outputs.token }}
          path: .build/previous-tap
          persist-credentials: false
      - name: Validate Homebrew lifecycle without Calendar access
        env:
          RESUME: ${{ needs.portable-ci.outputs.resume }}
        run: |
          set -euo pipefail
          mkdir -p .build/homebrew-state
          printf '%s\n' configuration-sentinel > .build/homebrew-state/config.yaml
          printf '%s\n' app-state-sentinel > .build/homebrew-state/app-state
          arguments=(
            --packages-directory .build/release-candidate/packages
            --work-directory .build/homebrew-validation
            --state-directory .build/homebrew-state
            --brew "$(command -v brew)"
          )
          formula_exists=false
          cask_exists=false
          [[ -f .build/previous-tap/Formula/calrelay.rb ]] && formula_exists=true
          [[ -f .build/previous-tap/Casks/calrelay.rb ]] && cask_exists=true
          [[ "$formula_exists" == "$cask_exists" ]] || { echo 'The previous tap must contain both CalRelay packages or neither.' >&2; exit 1; }
          if [[ "$formula_exists" == true ]]; then
            mkdir -p .build/previous-packages/Formula .build/previous-packages/Casks
            cp .build/previous-tap/Formula/calrelay.rb .build/previous-packages/Formula/calrelay.rb
            cp .build/previous-tap/Casks/calrelay.rb .build/previous-packages/Casks/calrelay.rb
            arguments+=(--previous-packages-directory .build/previous-packages)
          fi
          validator=scripts/release/validate-homebrew-packages.mjs
          [[ "${RESUME:-false}" != true ]] || validator="${RUNNER_TEMP}/calrelay-validate-homebrew-packages.mjs"
          [[ -s "$validator" ]] || { echo 'Homebrew validator is missing or empty.' >&2; exit 1; }
          node "$validator" "${arguments[@]}"
      - name: Publish formula and cask atomically
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CALRELAY_GIT_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          node scripts/release/publish-release.mjs tap \
            --candidate-directory .build/release-candidate \
            --source-repository "$GITHUB_REPOSITORY" \
            --tap-repository "${{ vars.CALRELAY_TAP_REPOSITORY }}" \
            --source-remote "https://github.com/${GITHUB_REPOSITORY}.git" \
            --tap-remote "https://github.com/${{ vars.CALRELAY_TAP_REPOSITORY }}.git" \
            --work-directory .build/release-publication \
            --gh "$(command -v gh)"
      - name: Clean protected release material
        if: always()
        run: |
          rm -rf .build/release-artifacts .build/release-candidate .build/release-metadata \
            .build/release-publication .build/previous-tap .build/previous-packages \
            .build/homebrew-validation .build/homebrew-state \
            "${RUNNER_TEMP}/calrelay-release-candidate" "${RUNNER_TEMP}/calrelay-source-publication.git" \
            "${RUNNER_TEMP}/calrelay-validate-homebrew-packages.mjs" \
            "${RUNNER_TEMP}/calrelay-restore-retained-source.sh"
          rm -f .build/release-publication.askpass-*
